<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Productive Dashboard</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark px-3">
      <div class="container-fluid">
        <!-- LEFT SIDE -->

        <div class="d-flex align-items-center gap-3">
          <!-- SIDEBAR BUTTON -->

          <button
            class="btn btn-outline-light"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#sidebar"
          >
            <i class="bi bi-list"></i>
          </button>

          <!-- TITLE -->

          <h4 class="text-white m-0">AI Dashboard</h4>
        </div>

        <!-- RIGHT SIDE -->

        <div class="d-flex align-items-center gap-3">
          <!-- DARK MODE -->

          <button class="btn btn-outline-light">
            <i class="bi bi-moon"></i>
          </button>

          <!-- NOTIFICATION -->

          <button class="btn btn-outline-light">
            <i class="bi bi-bell"></i>
          </button>

          <!-- PROFILE -->

          <button class="btn btn-outline-light">
            <i class="bi bi-person-circle"></i>
          </button>
        </div>
      </div>
    </nav>

    <!--- sidebar -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebar">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">Dashboard Menu</h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
        ></button>
      </div>

      <div class="offcanvas-body">
        <ul class="list-group">
          <li class="list-group-item">
            <i class="bi bi-house"></i>
            Dashboard
          </li>

          <li class="list-group-item">
            <i class="bi bi-check2-square"></i>
            Tasks
          </li>

          <li class="list-group-item">
            <i class="bi bi-bar-chart"></i>
            Analytics
          </li>

          <li class="list-group-item">
            <i class="bi bi-gear"></i>
            Settings
          </li>
        </ul>
      </div>
    </div>

    <!-- MAIN Dashboard Content -->

    <div class="container my-5">
      <!-- WELCOME CARD -->
      <div class="mb-4">
        <h2 class="fw-bold">Welcome to the AI Dashboard</h2>

        <p class="text-muted">
          Track your productivity and manage tasks efficiently.
        </p>
      </div>

      <!--Dashboard Content-->
      <div class="row g-4">
        <!-- Card 1-->

        <div class="col-md-3">
          <div class="card shadow-sm border-0 p-3">
            <div class="card-body">
              <h6 class="text-muted">Total Tasks</h6>

              <h2 class="fw-bold" id="totalTasks">0</h2>

              <i class="bi bi-list-task fs-1 text-primary"></i>
            </div>
          </div>
        </div>

        <!-- Card 2-->

        <div class="col-md-3">
          <div class="card shadow-sm border-0 p-3">
            <div class="card-body">
              <h6 class="text-muted">Completed</h6>

              <h2 class="fw-bold" id="completedTasks">0</h2>

              <i class="bi bi-check-circle fs-1 text-success"></i>
            </div>
          </div>
        </div>

        <!-- Card 3-->
        <div class="col-md-3">
          <div class="card shadow-sm border-0 p-3">
            <div class="card-body">
              <h6 class="text-muted">Pending</h6>

              <h2 class="fw-bold" id="pendingTasks">0</h2>

              <i class="bi bi-clock-history fs-1 text-warning"></i>
            </div>
          </div>
        </div>

        <!-- Card 4-->
        <div class="col-md-3">
          <div class="card shadow-sm border-0 p-3">
            <div class="card-body">
              <h6 class="text-muted">Productivity</h6>

              <h2 class="fw-bold" id="productivity">0%</h2>

              <i class="bi bi-bar-chart fs-1 text-danger"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Tasks Section -->
      <div class="mt-5">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm p-4">
            <h4 class="mb-4">Task Manager</h4>

            <!--Input Section-->

            <div class="d-flex gap-3 mb-4">
              <input
                type="text"
                class="form-control"
                placeholder="Enter a new task"
                id="taskInput"
              />

              <button class="btn btn-dark" id="addTaskBtn">Add Task</button>
            </div>

            <!-- Task List -->
            <ul class="list-group" id="taskList"></ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- JS -->
    <script src="script.js"></script>
  </body>
</html>
